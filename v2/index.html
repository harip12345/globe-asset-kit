<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Globe Lite — V2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%2391bb7b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="./"><span class="mark" aria-hidden="true">◎</span> GLOBE LITE <span class="version">V2</span></a>
    <nav class="header-actions" aria-label="Aksi aset"><a class="back" href="../">Versi 1 ↗</a><button id="open-json" class="quiet">Buka scene</button><button id="save-json" class="quiet">Simpan scene</button><button id="png" class="accent">↓ PNG</button><input id="file" type="file" accept=".json,application/json" hidden></nav>
  </header>
  <main>
    <section class="viewer" aria-label="Globe ilustrasi interaktif">
      <div class="view-heading"><div><span class="eyebrow">ILLUSTRATED EARTH</span><h1 id="place">Bumi</h1><p id="position">9° N · 118° E</p></div><div class="view-actions"><label class="sr-only" for="format">Format aset</label><select id="format"><option value="1920x1080">16:9</option><option value="1080x1920">9:16</option><option value="1080x1080">1:1</option></select><button id="settings-toggle" class="quiet" aria-expanded="false" aria-controls="settings">Pengaturan</button></div></div>
      <div id="viewport"><canvas id="globe-lite" aria-label="Globe ilustrasi daratan hijau, laut biru, dan atmosfer tipis"></canvas><div id="loading" role="status">Menyiapkan globe…</div></div>
      <div class="view-foot"><span>Drag untuk memutar <i>·</i> Scroll untuk zoom</span><span class="offline"><i></i> LOCAL · OFFLINE READY</span></div>
      <aside id="settings" hidden aria-label="Pengaturan globe">
        <div class="settings-title"><strong>Gaya globe</strong><button id="settings-close" class="close" aria-label="Tutup pengaturan">×</button></div>
        <div id="palettes" class="palettes" aria-label="Palet warna"></div>
        <label class="color-control" for="land">Daratan<input id="land" type="color"></label>
        <label class="color-control" for="ocean">Laut<input id="ocean" type="color"></label>
        <label class="color-control" for="atmosphere">Atmosfer<input id="atmosphere" type="color"></label>
        <label class="range-heading" for="halo">Halo <output id="halo-value">0.7</output></label><input id="halo" type="range" min="0" max="1.5" step="0.05">
        <label class="check-control"><input id="transparent" type="checkbox">Latar PNG transparan</label>
        <div class="coordinates"><label for="lat">Latitude<input id="lat" type="number" min="-85" max="85" step="0.01"></label><label for="lon">Longitude<input id="lon" type="number" min="-180" max="180" step="0.01"></label></div>
        <button id="go-coordinates" class="quiet full">Pindah ke koordinat</button>
      </aside>
    </section>
    <section class="navigation" aria-label="Navigasi antarpulau">
      <div class="navigation-heading"><div><span class="eyebrow">PILIH TUJUAN</span><p>Pindah pulau, tetap mengalir.</p></div><div class="motion"><label for="duration">Durasi <output id="duration-value">3.0 dtk</output></label><input id="duration" type="range" min="1" max="6" step="0.1" value="3"><button id="replay" class="quiet" disabled>↺ Ulangi</button></div></div>
      <div id="locations" class="locations"></div>
      <div class="navigation-foot"><span id="status" role="status">Memuat aset lokal…</span><a href="README.md">Panduan untuk AI agent ↗</a></div>
    </section>
  </main>
  <div id="notice" role="alert" hidden></div>
  <script type="module" src="app.js"></script>
</body></html>
